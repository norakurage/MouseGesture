name: Build Windows Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64
        run: dotnet publish MouseGesture\MouseGesture.csproj -c Release -r win-x64 --self-contained true -o dist\MouseGesture-win-x64

      - name: Add README
        shell: pwsh
        run: |
          @'
          MouseGesture 配布版

          使い方:
          1. ZIP を展開します。
          2. MouseGesture.exe を実行します。

          注意:
          - Windows x64 用です。
          - .NET ランタイムの別途インストールは不要です。
          - 管理者権限で起動します。手動起動時は UAC の確認が表示されます。
          - アプリ内で「コンピュータ起動時に自動で起動する」を有効にすると、ログオン時に最高権限のスケジュールタスクで起動します。
          - 自動起動の設定後は、通常のログオン起動では UAC の確認は表示されません。
          '@ | Set-Content -Path dist\MouseGesture-win-x64\README.txt -Encoding UTF8

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\MouseGesture-win-x64 -DestinationPath dist\MouseGesture-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseGesture-win-x64
          path: dist\MouseGesture-win-x64.zip

      - name: Update latest GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release create latest dist\MouseGesture-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Latest MouseGesture win-x64" `
            --notes "Automatically built from $env:GITHUB_SHA."
